services:
  - type: web
    name: cyberpunk26-backend
    env: python
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_ADMIN_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: BACKBLAZE_B2_ENABLED
        value: "true"
      - key: BACKBLAZE_B2_BUCKET_NAME
        sync: false
      - key: BACKBLAZE_B2_KEY_ID
        sync: false
      - key: BACKBLAZE_B2_APPLICATION_KEY
        sync: false
      - key: BACKBLAZE_B2_ENDPOINT_URL
        sync: false
      - key: BACKBLAZE_B2_REGION
        sync: false
      - key: BACKBLAZE_B2_CUSTOM_DOMAIN
        sync: false
      - key: BACKBLAZE_B2_ADDRESSING_STYLE
        value: path
